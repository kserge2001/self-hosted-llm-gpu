<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Astra infrastructure assistant</title>
<style>body{font:18px system-ui;max-width:750px;margin:5vh auto;padding:24px;color:#172d3c;background:#f7fafb}textarea{width:95%;min-height:110px;padding:12px;font:inherit}button{background:#164b60;color:white;border:0;border-radius:6px;padding:12px 24px;font:inherit;margin:14px 0}pre{white-space:pre-wrap;line-height:1.6}small{color:#506575}</style>
<h1>Astra infrastructure assistant</h1><p>Ask about the lab infrastructure. Tools can inspect its state; they cannot change it.</p>
<form><label for="question">Your question</label><p><textarea id="question" required maxlength="2000"></textarea></p><button>Ask Astra</button></form>
<pre role="status" aria-live="polite" id="answer"></pre><small id="trace"></small>
<script>const form=document.querySelector('form'),button=document.querySelector('button');form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;document.querySelector('#answer').textContent='Checking…';document.querySelector('#trace').textContent='';try{const r=await fetch('/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:document.querySelector('#question').value})});const v=await r.json();if(!r.ok)throw Error(v.detail||'Request failed');document.querySelector('#answer').textContent=v.answer;document.querySelector('#trace').textContent=v.trace_id?'Trace: '+v.trace_id:''}catch(e){document.querySelector('#answer').textContent=e.message}finally{button.disabled=false}});</script></html>

apiVersion: v1
kind: Namespace
metadata:
  name: synthetic
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: assistant-read
  namespace: synthetic
rules:
  - apiGroups: [""]
    resources: [pods, events]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: assistant-read
  namespace: synthetic
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: assistant-read
subjects:
  - kind: ServiceAccount
    name: k8s-assistant
    namespace: k8s-assistant

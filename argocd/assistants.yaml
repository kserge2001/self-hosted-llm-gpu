apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: astra-assistants
  namespace: argocd
spec:
  project: astra
  source:
    repoURL: ${GITOPS_REPOSITORY_URL}
    targetRevision: ${GITOPS_REVISION}
    path: deploy/assistants
  destination:
    server: https://kubernetes.default.svc
    namespace: k8s-assistant
  syncPolicy:
    syncOptions: [CreateNamespace=true]

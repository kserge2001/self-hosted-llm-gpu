apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: astra-mlflow
  namespace: argocd
spec:
  project: astra
  source:
    repoURL: ${GITOPS_REPOSITORY_URL}
    targetRevision: ${GITOPS_REVISION}
    path: k8s/mlflow-launcher
    helm:
      valuesObject:
        image: ${MLFLOW_LAUNCHER_IMAGE}
        roleArn: ${MLFLOW_LAUNCHER_ROLE_ARN}
        trackingServerName: ${MLFLOW_TRACKING_SERVER_NAME}
        loadBalancerArn: ${EXPECTED_ALB_ARN}
        cognitoClientId: ${COGNITO_CLIENT_ID}
  destination:
    server: https://kubernetes.default.svc
    namespace: mlflow
  syncPolicy:
    syncOptions:
      - CreateNamespace=true

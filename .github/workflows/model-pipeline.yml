name: Model file preparation
on:
  workflow_dispatch:
    inputs:
      request_json:
        description: Exact preparation inputs (release_id, pipeline_version, manifest_uri, manifest_version, manifest_sha256)
        required: true
        type: string
permissions:
  contents: read
jobs:
  start:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: astra-deploy
    timeout-minutes: 10
    concurrency:
      group: astra-model-preparation
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Check preparation inputs
        env:
          ASTRA_MODEL_REQUEST: ${{ inputs.request_json }}
          PIPELINE_NAME: ${{ vars.PIPELINE_NAME }}
        run: |
          python - <<'PY'
          import json, os
          from start_model_preparation import request_arguments
          request = json.loads(os.environ['ASTRA_MODEL_REQUEST'])
          request_arguments(request.get('release_id'), request, os.environ['PIPELINE_NAME'] or 'astra-model-release')
          PY
      - uses: aws-actions/configure-aws-credentials@5579c002bb4778aa43395ef1df492868a9a1c83f
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: astra-${{ github.run_id }}
      - name: Start the supplied CPU file checks
        env:
          ASTRA_MODEL_REQUEST: ${{ inputs.request_json }}
          PIPELINE_NAME: ${{ vars.PIPELINE_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/python -m pip install --requirement requirements-ci.lock
          arn=$(.venv/bin/python start_model_preparation.py --pipeline-name "${PIPELINE_NAME:-astra-model-release}")
          printf '### Model file checks started\n\nExecution ARN: %s\n' "$arn" >> "$GITHUB_STEP_SUMMARY"

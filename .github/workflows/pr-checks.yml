name: Starter checks
on:
  push:
    branches: [main, 'e2e/astra', 'codex/astra-classroom-readiness']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: '1.15.9'
          terraform_wrapper: false
      - name: Check the supplied Python implementation
        run: |
          bash setup_operator.sh
          export PATH="$PWD/.tools/bin:$PATH"
          source .venv/bin/activate
          kubectl version --client
          helm version
          python -m unittest discover -s tests -v
          python checks/client_compatibility.py
          python checks/assistant_compatibility.py
      - name: Validate Terraform without AWS credentials
        run: |
          terraform -chdir=infra fmt -check
          terraform -chdir=infra init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra validate -no-color
          terraform -chdir=infra test -no-color

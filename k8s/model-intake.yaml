apiVersion: v1
kind: Namespace
metadata:
  name: model-intake
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: model-intake
  namespace: model-intake
  annotations:
    eks.amazonaws.com/role-arn: ${INTAKE_ROLE_ARN}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ${INTAKE_JOB_NAME}
  namespace: model-intake
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  template:
    spec:
      serviceAccountName: model-intake
      nodeSelector: {astra/tier: cpu}
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: intake
          image: ${INTAKE_IMAGE}
          args: [/input/astra-candidate.json, --bucket, "${QUARANTINE_BUCKET}", --release-id, "${RELEASE_ID}"]
          env:
            - {name: AWS_DEFAULT_REGION, value: us-east-1}
          resources:
            requests: {cpu: 100m, memory: 256Mi, ephemeral-storage: 8Gi}
            limits: {memory: 512Mi, ephemeral-storage: 10Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: candidate, mountPath: /input, readOnly: true}
            - {name: temporary, mountPath: /tmp}
      volumes:
        - name: candidate
          configMap: {name: ${CANDIDATE_CONFIGMAP}}
        - name: temporary
          emptyDir: {sizeLimit: 8Gi}

apiVersion: v1
kind: ServiceAccount
metadata:
  name: astra-secret-reader
  annotations:
    eks.amazonaws.com/role-arn: {{ required "secretReaderRoleArn is required" .Values.secretReaderRoleArn | quote }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef: {name: astra-secret-reader}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-env
spec:
  refreshInterval: 1m
  secretStoreRef: {name: aws-secrets-manager, kind: SecretStore}
  target:
    name: litellm-env
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: {{ .Values.gatewaySecretArn | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rds-ca
data:
  rds-ca.pem: |
{{ required "The RDS public CA bundle is required" (.Files.Get "files/rds-ca.pem") | indent 4 }}

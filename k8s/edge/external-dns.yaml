apiVersion: v1
kind: Namespace
metadata:
  name: external-dns
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-dns
  namespace: external-dns
  annotations:
    eks.amazonaws.com/role-arn: ${EXTERNAL_DNS_ROLE_ARN}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: astra-external-dns
rules:
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gateways, httproutes]
    verbs: [get, list, watch]
  - apiGroups: ['']
    resources: [services, endpoints, pods, nodes, namespaces]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: astra-external-dns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: astra-external-dns
subjects:
  - kind: ServiceAccount
    name: external-dns
    namespace: external-dns
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
  namespace: external-dns
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: astra-external-dns}
  template:
    metadata:
      labels: {app: astra-external-dns}
    spec:
      serviceAccountName: external-dns
      nodeSelector: {astra/tier: cpu}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: external-dns
          # Official v0.24.0 multi-platform manifest, resolved 2026-10-29.
          image: registry.k8s.io/external-dns/external-dns@sha256:a80a146d2540fa138565e404f0625157271071a06093021f27ae19d8316d10f9
          args:
            - --source=gateway-httproute
            - --provider=aws
            - --domain-filter=${DOMAIN_NAME}
            - --zone-id-filter=${ZONE_ID}
            - --aws-zone-type=public
            - --label-filter=astra/platform=${CLUSTER_NAME}
            - --policy=sync
            - --registry=txt
            - --txt-owner-id=${TXT_OWNER_ID}
            - --txt-prefix=_astra-%{record_type}.
            - --interval=30s
          env:
            - {name: AWS_DEFAULT_REGION, value: us-east-1}
            - {name: AWS_STS_REGIONAL_ENDPOINTS, value: regional}
          ports:
            - {name: http, containerPort: 7979}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
